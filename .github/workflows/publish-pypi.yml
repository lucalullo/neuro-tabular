name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurotabular-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare identical TestPyPI distributions for PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require all 17 CI jobs on the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.prepare_release guard
      - name: Verify source manifest
        run: python tools/release_artifacts.py source
      - name: Find successful TestPyPI publication on the same commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.prepare_release source
      - name: Download original locked distributions
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-bundle/
      - name: Verify actual TestPyPI files and original hashes
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
        run: python tools/release_artifacts.py testpypi
      - name: Validate distribution hygiene and metadata
        run: |
          python -m pip install twine
          python tools/check_distribution.py release-bundle/dist/*.whl release-bundle/dist/*.tar.gz
          python -m twine check --strict release-bundle/dist/*
      - name: Retain original verified distributions
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neurotabular/
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Retrieve the identical TestPyPI distributions
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release-bundle/
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/dist/
