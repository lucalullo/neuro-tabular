name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurotabular-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare identical TestPyPI distributions for PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require all 17 CI jobs on the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.prepare_release guard
      - name: Verify source manifest
        run: python tools/release_artifacts.py source
      - name: Recover the exact published TestPyPI distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import email.parser
          import json
          import os
          import re
          import subprocess
          import tarfile
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          from tools import prepare_release as prep
          from tools import release_artifacts as release

          repo = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["GITHUB_SHA"]
          v = release.version()
          release.require(
              bool(re.fullmatch(r"[0-9a-f]{40}", head))
              and subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == head,
              "Exact checkout required",
          )


          def find_run(sha):
              query = urllib.parse.urlencode({
                  "head_sha": sha, "event": "workflow_dispatch",
                  "branch": "main", "per_page": 100,
              })
              data = release.github(f"repos/{repo}/actions/workflows/publish-testpypi.yml/runs?{query}")
              release.require(data["total_count"] == len(data["workflow_runs"]), "Incomplete run list")
              runs = [r for r in data["workflow_runs"] if prep.matching_run(r, sha)]
              release.require(len(runs) <= 1, "Ambiguous successful TestPyPI publications")
              return runs[0] if runs else None


          # Permit a bounded sequence of publication-workflow-only corrections.
          # All other tree changes require a new TestPyPI publication.
          source_sha = head
          run = None
          for _ in range(20):
              run = find_run(source_sha)
              if run is not None:
                  break
              parent = subprocess.check_output(["git", "rev-parse", source_sha + "^"], text=True).strip()
              release.require(bool(re.fullmatch(r"[0-9a-f]{40}", parent)), "Invalid parent commit")
              changed = set(subprocess.check_output([
                  "git", "diff", "--name-only", "-z", "--no-renames", parent, source_sha, "--"
              ]).split(b"\0")) - {b""}
              release.require(
                  changed == {b".github/workflows/publish-pypi.yml"},
                  "Recovery permits only publish-pypi.yml corrections; package changes require a new release",
              )
              source_sha = parent
          release.require(run is not None, "No successful TestPyPI publication for verified source")
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only", "-z", "--no-renames", source_sha, head, "--"
          ]).split(b"\0")) - {b""}
          release.require(changed <= {b".github/workflows/publish-pypi.yml"}, "Source tree changed")
          source_ci = release.successful_ci(repo, source_sha, v, branch="main")
          run_id = str(run["id"])
          release.require(bool(re.fullmatch(r"[1-9][0-9]*", run_id)), "Invalid source run ID")
          base = f"repos/{repo}/actions/runs/{run_id}"
          run = release.github(base)
          release.require(str(run["id"]) == run_id and prep.matching_run(run, source_sha), "Unverified source run")
          attempt = run["run_attempt"]
          release.require(type(attempt) is int and attempt >= 1, "Invalid publication attempt")
          data = release.github(base + f"/attempts/{attempt}/jobs?per_page=100")
          jobs = data["jobs"]
          release.require(
              data["total_count"] == len(jobs) == 2
              and {j["name"] for j in jobs} == {prep.JOB, prep.PUBLISH_JOB}
              and all(j["status"] == "completed" and j["conclusion"] == "success" for j in jobs),
              "Preparation and TestPyPI publication must both succeed",
          )

          # TestPyPI is the authoritative source of the actual uploaded bytes. Do not
          # reconstruct packages, depend on transient Actions artifacts, or fabricate
          # the missing original build receipt. Validate the complete source archive,
          # runtime files, metadata and registry hashes before promotion.
          MAX_BYTES = 128 * 1024 * 1024


          def checked_url(url, hosts):
              parsed = urllib.parse.urlsplit(url)
              release.require(
                  parsed.scheme == "https" and parsed.hostname in hosts
                  and parsed.port in {None, 443} and parsed.username is None and parsed.password is None,
                  "Unexpected registry URL",
              )


          class RestrictedRedirect(urllib.request.HTTPRedirectHandler):
              def __init__(self, hosts):
                  self.hosts = hosts

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  checked_url(newurl, self.hosts)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def download(url, hosts, limit):
              checked_url(url, hosts)
              opener = urllib.request.build_opener(RestrictedRedirect(hosts))
              request = urllib.request.Request(url, headers={"User-Agent": "NeuroTabular verified promotion"})
              with opener.open(request, timeout=60) as response:
                  checked_url(response.geturl(), hosts)
                  payload = response.read(limit + 1)
              release.require(len(payload) <= limit, "Registry response exceeds size limit")
              return payload


          registry = json.loads(download(
              f"https://test.pypi.org/pypi/neurotabular/{v}/json", {"test.pypi.org"}, 8 * 1024 * 1024,
          ))
          expected = set(release.names(v))
          release.require(
              registry["info"]["name"].lower() == "neurotabular"
              and registry["info"]["version"] == v
              and len(registry["urls"]) == 2
              and {item["filename"] for item in registry["urls"]} == expected,
              "Unexpected TestPyPI release identity or file list",
          )
          bundle = Path("release-bundle")
          directory = bundle / "dist"
          directory.mkdir(parents=True, exist_ok=False)
          hashes = {}
          for item in registry["urls"]:
              name = item["filename"]
              sha = item["digests"]["sha256"]
              release.require(
                  not item.get("yanked") and isinstance(sha, str)
                  and bool(re.fullmatch(r"[0-9a-f]{64}", sha))
                  and item["packagetype"] == ("bdist_wheel" if name.endswith(".whl") else "sdist")
                  and type(item["size"]) is int and 0 < item["size"] <= MAX_BYTES,
                  "Invalid TestPyPI distribution metadata",
              )
              # Independent release-specific evidence from the completed Kaggle notebook.
              if v == "2.1.0" and name.endswith(".whl"):
                  release.require(
                      sha == "9b9829a091f0d6c5e20a81d9de4f7dd598ae953d1df37eded88dadaa3a877d99",
                      "TestPyPI wheel differs from the wheel verified on Kaggle",
                  )
              payload = download(item["url"], {"test-files.pythonhosted.org", "files.pythonhosted.org"}, MAX_BYTES)
              release.require(len(payload) == item["size"] and release.digest(payload) == sha, "TestPyPI file hash or size mismatch")
              with (directory / name).open("xb") as f:
                  f.write(payload)
              hashes[name] = sha
          release.require(release.hashes(directory, v) == hashes, "Promoted file hashes mismatch")
          release.validate_archives(directory, v)

          # Explicitly preserve the README and license in the wheel and sdist metadata.
          readme = Path("README.md").read_text(encoding="utf8")
          license_bytes = Path("LICENSE").read_bytes()
          wheel_name, sdist_name = release.names(v)
          prefix = f"neurotabular-{v}.dist-info/"
          with zipfile.ZipFile(directory / wheel_name) as archive:
              meta = email.parser.BytesParser().parsebytes(archive.read(prefix + "METADATA"))
              release.require(meta.get_payload() == readme, "Wheel README mismatch")
              release.require(archive.read(prefix + "licenses/LICENSE") == license_bytes, "Wheel license mismatch")
          with tarfile.open(directory / sdist_name) as archive:
              prefix = f"neurotabular-{v}/"
              meta = email.parser.BytesParser().parsebytes(archive.extractfile(prefix + "PKG-INFO").read())
              release.require(meta.get_payload() == readme, "Sdist README mismatch")
              release.require(archive.extractfile(prefix + "LICENSE").read() == license_bytes, "Sdist license mismatch")

          receipt = {
              "project": "neurotabular", "version": v, "repository": repo,
              "promotion_commit": head, "source_commit": source_sha,
              "source_ci": source_ci, "source_run_id": run_id,
              "publication_attempt": attempt,
              "source_manifest_sha256": release.digest(Path("SOURCE_MANIFEST.sha256").read_bytes()),
              "file_origin": "TestPyPI registry", "files": hashes,
              "kaggle_wheel_hash_verified": v == "2.1.0",
              "original_build_artifact_used": False,
          }
          (bundle / "promotion-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf8")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Validate distribution hygiene and metadata
        run: |
          python -m pip install twine
          python tools/check_distribution.py release-bundle/dist/*.whl release-bundle/dist/*.tar.gz
          python -m twine check --strict release-bundle/dist/*
      - name: Retain original verified distributions
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neurotabular/
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Retrieve the identical TestPyPI distributions
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release-bundle/
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/dist/
