name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neurotabular-publication
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare identical TestPyPI distributions for PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require all 17 CI jobs on the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.prepare_release guard
      - name: Verify source manifest
        run: python tools/release_artifacts.py source
      - name: Resolve successful TestPyPI publication and original build attempt
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          from pathlib import Path

          from tools import prepare_release as prep
          from tools import release_artifacts as release

          repo = os.environ["GITHUB_REPOSITORY"]
          head = os.environ["GITHUB_SHA"]
          release.require(
              bool(re.fullmatch(r"[0-9a-f]{40}", head))
              and subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == head,
              "Exact checkout required",
          )

          def find_run(sha):
              query = urllib.parse.urlencode({
                  "head_sha": sha, "event": "workflow_dispatch",
                  "branch": "main", "per_page": 100,
              })
              data = release.github(f"repos/{repo}/actions/workflows/publish-testpypi.yml/runs?{query}")
              release.require(data["total_count"] == len(data["workflow_runs"]), "Incomplete run list")
              runs = [r for r in data["workflow_runs"] if prep.matching_run(r, sha)]
              release.require(len(runs) <= 1, "Ambiguous successful TestPyPI publications")
              return runs[0] if runs else None

          # Normal path: the exact current commit. Recovery path: its immediate
          # parent, ONLY when this publication workflow is the sole changed file.
          source_sha = head
          run = find_run(source_sha)
          if run is None:
              parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
              release.require(bool(re.fullmatch(r"[0-9a-f]{40}", parent)), "Invalid parent commit")
              changed = set(subprocess.check_output([
                  "git", "diff", "--name-only", "-z", "--no-renames", parent, head, "--"
              ]).split(b"\0")) - {b""}
              release.require(
                  changed == {b".github/workflows/publish-pypi.yml"},
                  "Recovery permits only a change to publish-pypi.yml; no package or manifest changes",
              )
              source_sha = parent
              run = find_run(source_sha)
          release.require(run is not None, "No successful TestPyPI publication for verified source")
          source_ci = release.successful_ci(repo, source_sha, release.version(), branch="main")
          run_id = str(run["id"])
          release.require(bool(re.fullmatch(r"[1-9][0-9]*", run_id)), "Invalid source run ID")
          base = f"repos/{repo}/actions/runs/{run_id}"
          run = release.github(base)
          release.require(str(run["id"]) == run_id and prep.matching_run(run, source_sha), "Unverified source run")
          attempt = run["run_attempt"]
          release.require(type(attempt) is int and 1 <= attempt <= 100, "Invalid source run attempt")

          def jobs_for(number):
              data = release.github(base + f"/attempts/{number}/jobs?per_page=100")
              release.require(data["total_count"] == len(data["jobs"]), "Incomplete job list")
              return data["jobs"]

          jobs = jobs_for(attempt)
          release.require(
              len(jobs) == 2 and {j["name"] for j in jobs} == {prep.JOB, prep.PUBLISH_JOB}
              and all(j["status"] == "completed" and j["conclusion"] == "success" for j in jobs),
              "Preparation and TestPyPI publication must both succeed",
          )
          prepared = next(j for j in jobs if j["name"] == prep.JOB)
          prep_id = prepared["id"]
          # A publish-only rerun retains the successful preparation job and its
          # artifact. Find the first attempt containing that exact job ID.
          build_attempt = None
          for number in range(1, attempt + 1):
              previous = jobs if number == attempt else jobs_for(number)
              found = [j for j in previous if j["id"] == prep_id]
              release.require(len(found) <= 1, "Duplicate preparation job")
              if found:
                  job = found[0]
                  release.require(
                      job["name"] == prep.JOB and job["status"] == "completed"
                      and job["conclusion"] == "success", "Unverified preparation job",
                  )
                  build_attempt = number
                  break
          release.require(build_attempt is not None, "Original successful build attempt missing")
          data = release.github(base + "/artifacts?per_page=100")
          release.require(data["total_count"] == len(data["artifacts"]), "Incomplete artifact list")
          expected = f"testpypi-distributions-{run_id}-{build_attempt}"
          matches = [a for a in data["artifacts"] if a["name"] == expected]
          release.require(
              len(matches) == 1 and not matches[0]["expired"]
              and matches[0]["workflow_run"]["head_sha"] == source_sha,
              "Original TestPyPI preparation artifact missing, expired or unrelated",
          )
          artifact_id = matches[0]["id"]
          release.require(type(artifact_id) is int and artifact_id > 0, "Invalid artifact ID")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf8") as f:
              f.write(f"run_id={run_id}\nsource_attempt={build_attempt}\nartifact_id={artifact_id}\nsource_sha={source_sha}\n")
          print(json.dumps({"source_commit": source_sha, "source_ci": source_ci,
                            "source_run_id": run_id, "publication_attempt": attempt,
                            "build_attempt": build_attempt, "artifact_id": artifact_id}))
          PY
      - name: Download original locked distributions
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release-bundle/
      - name: Verify actual TestPyPI files and original hashes
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          EXPECTED_SOURCE_ATTEMPT: ${{ steps.source.outputs.source_attempt }}
          VERIFIED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: GITHUB_SHA="$VERIFIED_SOURCE_SHA" python tools/release_artifacts.py testpypi
      - name: Validate distribution hygiene and metadata
        run: |
          python -m pip install twine
          python tools/check_distribution.py release-bundle/dist/*.whl release-bundle/dist/*.tar.gz
          python -m twine check --strict release-bundle/dist/*
      - name: Retain original verified distributions
        id: bundle
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neurotabular/
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Retrieve the identical TestPyPI distributions
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release-bundle/
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/dist/
