name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  windows-test:
    name: Windows Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  torch-minimum:
    name: PyTorch 2.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "numpy<2"
      - run: >-
          python -m pip install "torch==2.0.1"
          --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  package:
    name: Build distributions
    needs: [lint, test, windows-test, torch-minimum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test both distributions outside the checkout
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            scratch="$(mktemp -d)"
            python -m venv "$scratch/venv"
            "$scratch/venv/bin/python" -m pip install "$artifact"
            cat > "$scratch/smoke.py" <<'PY'
          import numpy as np
          import pandas as pd
          from neurotabular import NeuroTabularClassifier, NeuroTabularRegressor

          Xb = pd.DataFrame({
              "x": np.linspace(-2.0, 2.0, 18),
              "cat": np.resize(["a", "b", "c"], 18),
          })
          yb = np.resize([0, 1], 18)
          binary = NeuroTabularClassifier(max_epochs=2, random_state=1).fit(Xb, yb)
          assert binary.predict(Xb).shape == (18,)
          assert binary.predict_proba(Xb).shape == (18, 2)

          Xm = pd.DataFrame({
              "x": np.linspace(-3.0, 3.0, 30),
              "cat": np.resize(["a", "b", "c", "d", "e"], 30),
          })
          ym = np.resize(["red", "green", "blue"], 30)
          multi = NeuroTabularClassifier(max_epochs=2, random_state=2).fit(Xm, ym)
          proba = multi.predict_proba(Xm)
          assert multi.predict(Xm).shape == (30,)
          assert proba.shape == (30, 3)
          np.testing.assert_allclose(proba.sum(axis=1), 1.0, rtol=1e-6, atol=1e-6)

          Xr = pd.DataFrame({
              "x": np.linspace(-2.0, 2.0, 30),
              "cat": np.resize(["a", "b", "c"], 30),
          })
          yr = np.linspace(-5.0, 7.0, 30)
          reg = NeuroTabularRegressor(max_epochs=2, random_state=3).fit(Xr, yr)
          pred = reg.predict(Xr)
          assert pred.shape == (30,)
          assert np.isfinite(pred).all()
          PY
            (cd "$scratch" && "$scratch/venv/bin/python" -I smoke.py)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: neurotabular-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
