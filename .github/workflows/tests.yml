name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  windows-test:
    name: Windows Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  torch-minimum:
    name: PyTorch 2.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "numpy<2"
      - run: >-
          python -m pip install "torch==2.0.1"
          --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  package:
    name: Build distributions
    needs: [lint, test, windows-test, torch-minimum]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the built wheel outside the source tree
        shell: bash
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install --upgrade pip
          wheel-check/bin/python -m pip install dist/*.whl
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          "$GITHUB_WORKSPACE/wheel-check/bin/python" - <<'PY'
          import pandas as pd
          from neurotabular import NeuroTabularClassifier

          X = pd.DataFrame({"x": [0., 1., 2., 3., 4., 5.], "cat": ["a", "a", "b", "b", "a", "b"]})
          y = [0, 0, 0, 1, 1, 1]
          model = NeuroTabularClassifier(max_epochs=2, random_state=1)
          model.fit(X, y)
          assert model.predict(X).shape == (6,)
          assert model.predict_proba(X).shape == (6, 2)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: neurotabular-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
