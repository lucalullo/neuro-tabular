name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.8"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  windows-test:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  torch-minimum:
    name: PyTorch 2.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "numpy<2"
      - run: >-
          python -m pip install "torch==2.0.1"
          --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -W error

  macos-test:
    name: macOS Python 3.14 (new platform evidence)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -W error

  dependency-minimum:
    name: Lowest binary dependencies Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            numpy: "1.24.0"
            pandas: "2.0.0"
            sklearn: "1.3.0"
            torch: "2.0.0"
            scipy: "1.9.2"
            joblib: "1.1.1"
            threadpoolctl: "2.0.0"
          - python-version: "3.12"
            numpy: "1.26.0"
            pandas: "2.1.1"
            sklearn: "1.3.1"
            torch: "2.2.0"
            scipy: "1.11.2"
            joblib: "1.5.0"
            threadpoolctl: "2.0.0"
          - python-version: "3.13"
            numpy: "2.1.0"
            pandas: "2.2.3"
            sklearn: "1.5.2"
            torch: "2.5.0"
            scipy: "1.14.1"
            joblib: "1.4.2"
            threadpoolctl: "3.1.0"
          - python-version: "3.14"
            numpy: "2.3.2"
            pandas: "2.3.3"
            sklearn: "1.7.2"
            torch: "2.9.0"
            scipy: "1.16.1"
            joblib: "1.5.2"
            threadpoolctl: "3.1.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install ".[dev]"
          "numpy==${{ matrix.numpy }}" "pandas==${{ matrix.pandas }}"
          "scikit-learn==${{ matrix.sklearn }}" "torch==${{ matrix.torch }}"
          "scipy==${{ matrix.scipy }}" "joblib==${{ matrix.joblib }}"
          "threadpoolctl==${{ matrix.threadpoolctl }}"
      - run: >-
          python -m pytest -W error tests/test_preprocessing.py
          tests/test_sklearn_compat.py tests/test_persistence.py
          tests/test_multiclass.py tests/test_regressor.py

  package:
    name: Build distributions
    needs: [lint, test, windows-test, torch-minimum, dependency-minimum, macos-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Verify complete source manifest
        run: python tools/release_artifacts.py source
      - run: python -m build
      - name: Validate distribution hygiene
        run: python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - run: python -m twine check --strict dist/*
      - name: Install and smoke-test both distributions outside the checkout
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            scratch="$(mktemp -d)"
            python -m venv "$scratch/venv"
            # Preinstall CPU-only PyTorch for package smoke testing. The default
            # Linux torch resolver also installs several GB of CUDA wheels.
            "$scratch/venv/bin/python" -m pip install --no-cache-dir \
              "torch==2.12.1" --index-url https://download.pytorch.org/whl/cpu
            "$scratch/venv/bin/python" -m pip install --no-cache-dir "$artifact"
            "$scratch/venv/bin/python" -m pip check
            "$scratch/venv/bin/python" -c 'import torch; assert torch.version.cuda is None, "Expected CPU-only PyTorch"'
            cat > "$scratch/smoke.py" <<'PY'
          import numpy as np
          import pandas as pd
          from neurotabular import NeuroTabularClassifier, NeuroTabularRegressor

          Xb = pd.DataFrame({
              "x": np.linspace(-2.0, 2.0, 18),
              "cat": np.resize(["a", "b", "c"], 18),
          })
          yb = np.resize([0, 1], 18)
          binary = NeuroTabularClassifier(max_epochs=2, random_state=1).fit(Xb, yb)
          assert binary.predict(Xb).shape == (18,)
          assert binary.predict_proba(Xb).shape == (18, 2)

          Xm = pd.DataFrame({
              "x": np.linspace(-3.0, 3.0, 30),
              "cat": np.resize(["a", "b", "c", "d", "e"], 30),
          })
          ym = np.resize(["red", "green", "blue"], 30)
          multi = NeuroTabularClassifier(max_epochs=2, random_state=2).fit(Xm, ym)
          proba = multi.predict_proba(Xm)
          assert multi.predict(Xm).shape == (30,)
          assert proba.shape == (30, 3)
          np.testing.assert_allclose(proba.sum(axis=1), 1.0, rtol=1e-6, atol=1e-6)

          Xr = pd.DataFrame({
              "x": np.linspace(-2.0, 2.0, 30),
              "cat": np.resize(["a", "b", "c"], 30),
          })
          yr = np.linspace(-5.0, 7.0, 30)
          reg = NeuroTabularRegressor(max_epochs=2, random_state=3).fit(Xr, yr)
          pred = reg.predict(Xr)
          assert pred.shape == (30,)
          assert np.isfinite(pred).all()
          PY
            (cd "$scratch" && "$scratch/venv/bin/python" -I smoke.py)
            rm -rf -- "$scratch"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: neurotabular-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
