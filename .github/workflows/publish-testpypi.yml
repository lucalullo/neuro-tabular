name: TestPyPI preparation - no upload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testpypi-preparation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare TestPyPI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Require all 17 CI jobs on the exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.prepare_release guard
      - name: Verify source manifest
        run: python tools/release_artifacts.py source
      - name: Install CPU PyTorch and development dependencies
        run: |
          python -m pip install "torch==2.12.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -W error
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify exact distributions and lock their hashes
        run: python tools/release_artifacts.py lock
      - name: Validate distribution hygiene and README rendering
        run: |
          python tools/check_distribution.py release-bundle/dist/*.whl release-bundle/dist/*.tar.gz
          python -m twine check --strict release-bundle/dist/*
      - name: Install built wheel and verify dependencies
        run: |
          python -m pip uninstall -y neurotabular
          python -m pip install --no-deps release-bundle/dist/*.whl
          python -m pip check
          python -I -c 'import neurotabular; print(neurotabular.__version__)'
      - name: Test installed package
        run: python -m pytest -W error
      - name: Retain verified distributions for manual TestPyPI upload
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-distributions-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Preparation summary (no upload)
        run: |
          echo '## TestPyPI preparation complete' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact, extract it, and manually upload only the two files in dist/ to TestPyPI. No registry upload was performed.' >> "$GITHUB_STEP_SUMMARY"
