name: Bug report
description: Report a reproducible NeuroTabular problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include private data, credentials, or undisclosed security
        vulnerabilities. Follow SECURITY.md for private security reports.
  - type: input
    id: version
    attributes:
      label: NeuroTabular version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Python, OS family, PyTorch, NumPy, pandas, sklearn, requested/resolved
        device and CUDA availability. Optionally use examples/support_environment.py.
        Do not paste paths, usernames, machine IDs or environment variables.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include imports, a tiny invented DataFrame, target, estimator settings and random_state. No private dataset or model upload is needed.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or diagnostic output
      description: Paste the error, or write "No exception". Redact usernames, paths, secrets and private values first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
