name: Bug report
description: Report a reproducible NeuroTabular problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include private data, credentials, or undisclosed security
        vulnerabilities. Follow SECURITY.md for private security reports.
  - type: input
    id: version
    attributes:
      label: NeuroTabular version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, device, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
