[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurotabular"
version = "2.0.0"
description = "Compact neural classification and regression for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luca Lullo" }]
keywords = ["machine-learning", "deep-learning", "tabular", "pytorch", "scikit-learn"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "torch>=2.0",
  "joblib>=1.5; python_version == '3.12'",
  "joblib>=1.4.2,!=1.5.0,!=1.5.1; python_version == '3.13'",
  "joblib>=1.5.2; python_version == '3.14'",
  "joblib>=1.6; python_version >= '3.15'",
  "scikit-learn>=1.3",
]

[project.urls]
Documentation = "https://github.com/lucalullo/neuro-tabular/blob/main/docs/USAGE.md"
Homepage = "https://github.com/lucalullo/neuro-tabular"
Repository = "https://github.com/lucalullo/neuro-tabular"
Issues = "https://github.com/lucalullo/neuro-tabular/issues"
Changelog = "https://github.com/lucalullo/neuro-tabular/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "psutil>=6",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["neurotabular*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
